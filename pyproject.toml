[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omarchy-look"
version = "0.1.0"
description = "Omarchy-style QML Outlook clone using Microsoft Graph"
requires-python = ">=3.10"
authors = [{name = "Adam"}]
license = {text = "MIT"}
dependencies = [
    "PySide6>=6.7.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "keyring>=24.3.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
