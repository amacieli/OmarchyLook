[package]
name = "omarchy-look"
version = "0.1.0"
edition = "2021"
authors = ["Adam"]
license = "MIT"
description = "Omarchy-style QML Outlook clone using Microsoft Graph (Rust backend)"

[dependencies]
# HTTP & networking
ureq = { version = "2.9", features = ["json"] }  # Sync HTTP client
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# OAuth2
oauth2 = "4.4"
url = "2.5"

# Keyring (Linux SecretService)
keyring = "2.1"

# Configuration (TOML)
toml = "0.8"

# SQLite with FTS5
rusqlite = { version = "0.30", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }

# File watching (for settings file)
notify = "6.1"

# Qt bindings (cxx-qt) - Phase 2 integration
cxx-qt = { version = "0.10" }
cxx = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
urlencoding = "2.1"
regex = "1.10"
dirs = "7.0.0"

[build-dependencies]
# Qt build integration - Phase 2
cxx-qt-build = { version = "0.10" }
cxx-build = "1.0"

[[bin]]
name = "omarchy-look"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
